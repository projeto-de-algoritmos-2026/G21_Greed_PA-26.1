<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Resource Optimizer - Interval Partitioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Otimizador de Recursos em Nuvem</h1>
            <p class="subtitle">Algoritmo de Particionamento de Intervalos</p>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Adicionar Novo Job</h2>
            <form id="jobForm" class="job-form">
                <div class="form-group">
                    <label for="jobName">Nome do Job</label>
                    <input type="text" id="jobName" placeholder="ex: ProcessamentoDados" required>
                </div>
                <div class="form-group">
                    <label for="startTime">Hora de Início (HH:MM)</label>
                    <input type="text" id="startTime" placeholder="ex: 08:00" required>
                </div>
                <div class="form-group">
                    <label for="endTime">Hora de Fim (HH:MM)</label>
                    <input type="text" id="endTime" placeholder="ex: 10:00" required>
                </div>
                <button type="submit" class="btn btn-primary">Adicionar Job</button>
                <button type="button" id="randomizeBtn" class="btn btn-secondary">Aleatorizar</button>
            </form>
        </section>

        <section class="chart-section">
            <h2>Alocação de Recursos</h2>
            <div id="ganttChart" class="gantt-chart">
                <div class="chart-placeholder">
                    <p>Chart will appear here</p>
                </div>
            </div>
        </section>

        <section class="metrics-section">
            <h2>Métricas</h2>
            <div id="metricsContainer" class="metrics">
                <div class="metric">
                    <span class="metric-label">Servidores Usados:</span>
                    <span class="metric-value">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Total de Jobs:</span>
                    <span class="metric-value">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Eficiência (%):</span>
                    <span class="metric-value">-</span>
                </div>
            </div>
        </section>
    </main>

    <script src="engine.js"></script>
    <script src="data.js"></script>
    <script src="ui.js"></script>
</body>
</html>
